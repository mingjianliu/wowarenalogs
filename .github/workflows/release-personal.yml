name: release-personal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v12.7.0-r1)'
        required: true
        type: string
jobs:
  build_and_release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CI: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''
    steps:
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: restore distutils for node-gyp (Python 3.12+ dropped it)
        run: python -m pip install --upgrade setuptools
      - name: clean npm cache
        run: npm cache clean -f
      # windows-latest now uses the VS2026 (Visual Studio 18.x) image. node-gyp only detects
      # that toolset from v12.1.0, which ships bundled in npm >= 11.6.3 (node 22's default npm
      # is ~10.9 and can't see VS2026, so the `noobs` native optionalDependency silently fails
      # to build and gets dropped, breaking copyNoobs in build:app). Upgrading npm here makes
      # `npm ci` use its bundled node-gyp 12.1.0. A bare `npm i -g node-gyp` does NOT work:
      # npm ci uses its own bundled node-gyp, not the global one.
      - name: upgrade npm (bundles node-gyp 12.1.0 for VS2026 toolset)
        run: npm install -g npm@latest
      - name: install dependencies
        run: npm ci --legacy-peer-deps
      - name: set version from tag
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version
      - name: build and publish for windows
        run: npm run publish:app:windows
