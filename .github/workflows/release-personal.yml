name: release-personal
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v12.7.0-r1)'
        required: true
        type: string
jobs:
  build_and_release:
    # Pin to windows-2022 (Server 2022 / VS2022 toolset). Both windows-latest AND windows-2025
    # now redirect to the VS2026 image (windows-2025-vs2026), where the `noobs` native
    # optionalDependency fails to install (silently skipped by npm ci), breaking copyNoobs in
    # build:app. windows-2022 is a distinct label not subject to that redirect.
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      CI: false
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CSC_LINK: ''
      CSC_KEY_PASSWORD: ''
    steps:
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.14
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: restore distutils for node-gyp (Python 3.12+ dropped it)
        run: python -m pip install --upgrade setuptools
      - name: clean npm cache
        run: npm cache clean -f
      - name: install node-gyp
        run: npm i -g node-gyp@latest
      - name: install dependencies
        run: npm ci --legacy-peer-deps
      - name: set version from tag
        shell: pwsh
        run: |
          $version = "${{ inputs.tag }}".TrimStart('v')
          npm version $version --no-git-tag-version --allow-same-version
      - name: build and publish for windows
        run: npm run publish:app:windows
